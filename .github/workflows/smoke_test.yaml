name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Smoke test — Python 3.11 / ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gfortran

      - uses: mpi4py/setup-mpi@v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install numpy ducc0
          pip install git+https://github.com/carronj/plancklens
          pip install git+https://github.com/carronj/lenspyx

      - name: Run smoke test
        run: python -m unittest tests/test_integration_mwe.py -v
