name: Installation

on:
  push:
  pull_request:

jobs:
  install:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false      # show all failures, not just the first
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # Spot-check macOS on the oldest and newest supported Pythons
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      # gfortran MUST come before setup-mpi and before plancklens build
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gfortran
          gfortran --version

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # brew gcc lands at a versioned path e.g. gfortran-14 — find and symlink it
          GFORTRAN=$(ls $(brew --prefix gcc)/bin/gfortran-* | head -1)
          sudo ln -sf "$GFORTRAN" /usr/local/bin/gfortran
          gfortran --version

      # MPI setup after gfortran is in PATH
      - uses: mpi4py/setup-mpi@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip / build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install numpy (build-time dep for several packages)
        run: pip install numpy

      - name: Install ducc0
        run: pip install ducc0

      - name: Install plancklens (GitHub, requires gfortran + MPI)
        run: pip install git+https://github.com/carronj/plancklens

      - name: Install lenspyx (GitHub, with missing-file workaround)
        run: |
          git clone https://github.com/carronj/lenspyx.git /tmp/lenspyx
          touch /tmp/lenspyx/lenspyx/data/cls/FFP10_wtensors_tensCls.dat
          pip install /tmp/lenspyx

      - name: Install delensalot + remaining deps
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .